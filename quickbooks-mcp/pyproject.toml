[project]
name = "quickbooks-mcp"
version = "0.1.0"
description = "MCP server for QuickBooks bank accounts, transactions, and balances"
authors = [
  { name = "pdrivomHW", email = "pedro.marques@hostwise.pt" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard] (>=0.124.0,<0.126.0)",
  "google-cloud-firestore (>=2.18.0,<3.0.0)",
  "google-cloud-secret-manager (>=2.20.0,<3.0.0)",
  "intuit-oauth (>=1.2.6,<2.0.0)",
  "mcp[cli] (>=1.26.0,<2.0.0)",
  "pydantic (>=2.11.0)",
  "requests",
  "uvicorn",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
