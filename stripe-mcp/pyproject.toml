[tool.poetry]
name = "stripe-mcp"
version = "0.1.0"
description = "MCP server for Stripe (payouts, customers, charges, balance, account)"
authors = ["Host-Wise"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
mcp = ">=1.26.0,<2.0.0"
stripe = ">=11.0.0"
uvicorn = ">=0.27.0"
fastapi = ">=0.115.0"
google-cloud-secret-manager = ">=2.20.0"
python-dotenv = ">=1.0.0"
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
