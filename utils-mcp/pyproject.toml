[tool.poetry]
name = "utils-mcp"
version = "0.1.0"
description = "MCP server for travel and local utility lookups: weather, events, flights, and demand"
authors = ["Host-Wise"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
mcp = ">=1.26.0,<2.0.0"
pydantic = ">=2.0.0"
uvicorn = ">=0.27.0"
fastapi = ">=0.115.0"
google-auth = ">=2.23.0"
google-cloud-secret-manager = ">=2.20.0"
python-dotenv = ">=1.0.0"
requests = ">=2.28.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
