# Database Schema Configuration
# This file defines the tables, columns, and relationships for the SQL query bot (references is the foreign key reference)

tables:
  - name: accounting_bankentry
    summary: "Bank statement transactions for reconciliation with platform payouts"
    columns:
      - name: created_at
        type: timestamp
        description: Record creation timestamp
      - name: updated_at
        type: timestamp
        description: Record last update timestamp
      - name: id
        type: text
        primary_key: true
        description: Unique identifier (primary key)
      - name: bank_entry_id
        type: text
        description: Bank transaction identifier from the bank statement
      - name: amount
        type: decimal
        description: Transaction amount from bank statement (positive for credits, negative for debits)
      - name: date
        type: timestamp
        description: Transaction or event date
      - name: description
        type: text
        description: Transaction description as it appears on the bank statement
      - name: account_name
        type: text
        description: Bank account name where the transaction occurred
      - name: platform_match
        type: text
        allowed_values:
          - airbnb
          - booking
          - stripe
          - sumup
        description: Matched booking platform if the entry was reconciled (airbnb, booking, stripe, sumup)
    description: Bank transaction entries from bank statements, used for reconciliation with platform payouts
  - name: accounting_creditnote
    summary: "Credit notes for refunds and cancellation adjustments"
    columns:
      - name: created_at
        type: timestamp
        description: Record creation timestamp
      - name: updated_at
        type: timestamp
        description: Record last update timestamp
      - name: id
        type: text
        primary_key: true
        description: Unique identifier (primary key)
      - name: company_id
        type: text
        description: Accounting system company identifier (Moloni)
      - name: price
        type: decimal
        description: Net price of the credit note before taxes
      - name: gross_value
        type: decimal
        description: Total credit note value including taxes
      - name: series_id
        type: text
        description: Document series identifier in accounting system
      - name: date
        type: timestamp
        description: Transaction or event date
      - name: expiration_date
        type: timestamp
      - name: document_set_id
        type: text
        description: Document set identifier in accounting system
      - name: customer_id
        type: text
        description: Customer identifier in accounting system
      - name: alternate_address_id
        type: text
        description: Alternative billing address if different from default
      - name: our_reference
        type: text
        description: Internal reference number
      - name: your_reference
        type: text
        description: Customer reference number
      - name: financial_discount
        type: decimal
        description: Financial discount amount or percentage
      - name: salesman_id
        type: text
        description: Salesperson identifier
      - name: salesman_commission
        type: decimal
        description: Commission earned by salesperson
      - name: deduction_id
        type: text
        description: Tax deduction identifier if applicable
      - name: special_discount
        type: decimal
        description: Special discount amount or percentage
      - name: associated_documents_associated_id
        type: text
      - name: associated_documents_value
        type: decimal
      - name: delivery_method_id
        type: text
      - name: delivery_datetime
        type: timestamp
      - name: delivery_departure_address
        type: text
      - name: delivery_departure_city
        type: text
      - name: delivery_departure_zip_code
        type: text
      - name: delivery_departure_country
        type: text
      - name: delivery_destination_address
        type: text
      - name: delivery_destination_city
        type: text
      - name: delivery_destination_zip_code
        type: text
      - name: delivery_destination_country
        type: text
      - name: vehicle_id
        type: text
      - name: products
        type: text
        description: JSON array of products/services included in the credit note
      - name: notes
        type: text
        description: Additional notes or comments
      - name: status
        type: text
        description: Current status of the record
      - name: moloni_credit_note_id
        type: text
        description: Credit note ID in Moloni accounting system
      - name: invoice_id
        type: text
        references: accounting_invoice.id
        description: Original invoice being credited
      - name: transaction_id
        type: text
        references: accounting_transaction.id
        description: Related financial transaction
    description: Credit notes issued to customers for refunds, cancellations, or adjustments
  - name: accounting_invoice
    summary: "Invoices generated for customer reservations and services"
    columns:
      - name: created_at
        type: timestamp
        description: Record creation timestamp
      - name: updated_at
        type: timestamp
        description: Record last update timestamp
      - name: id
        type: text
        primary_key: true
        description: Unique identifier (primary key)
      - name: company_id
        type: text
        description: Accounting system company identifier (Moloni)
      - name: price
        type: decimal
        description: Net invoice price before taxes
      - name: series_id
        type: text
        description: Document series identifier in accounting system
      - name: date
        type: timestamp
        description: Transaction or event date
      - name: expiration_date
        type: timestamp
      - name: document_set_id
        type: text
        description: Document set identifier in accounting system
      - name: customer_id
        type: text
        description: Customer identifier in accounting system
      - name: alternate_address_id
        type: text
        description: Alternative billing address if different from default
      - name: our_reference
        type: text
        description: Internal reference number
      - name: your_reference
        type: text
        description: Customer reference number
      - name: financial_discount
        type: decimal
        description: Financial discount amount or percentage
      - name: salesman_id
        type: text
        description: Salesperson identifier
      - name: salesman_commission
        type: decimal
        description: Commission earned by salesperson
      - name: deduction_id
        type: text
        description: Tax deduction identifier if applicable
      - name: special_discount
        type: decimal
        description: Special discount amount or percentage
      - name: associated_documents_associated_id
        type: text
      - name: associated_documents_value
        type: decimal
      - name: delivery_method_id
        type: text
      - name: delivery_datetime
        type: timestamp
      - name: delivery_departure_address
        type: text
      - name: delivery_departure_city
        type: text
        allowed_values:
          - ""
      - name: delivery_departure_zip_code
        type: text
        allowed_values:
          - ""
      - name: delivery_departure_country
        type: text
        allowed_values:
          - ""
      - name: delivery_destination_address
        type: text
      - name: delivery_destination_city
        type: text
        allowed_values:
          - ""
      - name: delivery_destination_zip_code
        type: text
        allowed_values:
          - ""
      - name: delivery_destination_country
        type: text
        allowed_values:
          - ""
      - name: vehicle_id
        type: text
      - name: products
        type: text
        description: JSON array of products/services included in the invoice
      - name: notes
        type: text
        description: Additional notes or comments
      - name: status
        type: text
        allowed_values:
          - pending
          - permanent
        description: "Invoice status (pending: draft, permanent: finalized)"
      - name: moloni_invoice_id
        type: text
        description: Invoice ID in Moloni accounting system
      - name: invoiceable_transaction_id
        type: text
        references: accounting_invoiceabletransaction.id
        description: Transaction being invoiced
      - name: gross_value
        type: decimal
        description: Total invoice value including all taxes
    description: Invoices generated for customer reservations and services rendered
  - name: accounting_invoiceabletransaction
    summary: "Transactions eligible for invoicing, linking reservations to accounting"
    columns:
      - name: created_at
        type: timestamp
        description: Record creation timestamp
      - name: updated_at
        type: timestamp
        description: Record last update timestamp
      - name: id
        type: text
        primary_key: true
        description: Unique identifier (primary key)
      - name: reservation_id
        type: text
        references: reservations_reservation.id
        description: Related reservation identifier
      - name: reservation_status
        type: text
        allowed_values:
          - accepted
          - canceled
          - cancelled
          - confirmed
          - no_show
        description: Reservation status at time of invoicing
      - name: city_tax_value
        type: decimal
        description: City/tourist tax amount charged
      - name: listing_id
        type: text
        references: listings_listing.id
        description: Property listing identifier
      - name: listing_nickname
        type: text
        description: User-friendly listing name
      - name: al_number
        type: text
        description: AL (Alojamento Local) license number - Portuguese short-term rental license
      - name: moloni_customer_id
        type: text
        description: Customer ID in Moloni accounting system
      - name: moloni_product_id
        type: text
        description: Product/service ID in Moloni accounting system
      - name: moloni_product_name
        type: text
        description: Product/service name in Moloni
      - name: reconciliation_id
        type: text
        references: accounting_reconciliation.id
        description: Reconciliation record linking to bank entry
      - name: transaction_id
        type: text
        references: accounting_transaction.id
        description: Related financial transaction
      - name: platform
        type: text
        description: Booking platform where reservation originated
      - name: confirmation_code
        type: text
        description: Booking platform confirmation code
      - name: type
        type: text
        allowed_values:
          - Extras Only
          - Pagamento da Resolução
          - Passar Pelo Total
          - Reserva
          - Reservation
          - Reservation without TT
          - Security Deposit
        description: Transaction type (Reservation, Extras Only, Security Deposit, etc.)
    description: Transactions that can be invoiced, linking reservations to accounting documents
  - name: accounting_payout
    summary: "Payouts received from booking platforms (Airbnb, Booking, Stripe)"
    columns:
      - name: created_at
        type: timestamp
        description: Record creation timestamp
      - name: updated_at
        type: timestamp
        description: Record last update timestamp
      - name: id
        type: text
        primary_key: true
        description: Unique identifier (primary key)
      - name: date
        type: timestamp
        description: Payout date when funds were transferred
      - name: amount
        type: decimal
        description: Payout amount received
      - name: platform
        type: text
        allowed_values:
          - airbnb
          - booking
          - stripe
          - sumup
        description: Platform making the payout (airbnb, booking, stripe, sumup)
      - name: platform_transaction_id
        type: text
        description: Transaction ID in the platform system
      - name: platform_details
        type: text
        description: JSON with additional platform-specific details
      - name: type
        type: text
        allowed_values:
          - adjustment
          - payout
        description: "Payout type (payout: regular, adjustment: correction/adjustment)"
    description: Payouts received from booking platforms (Airbnb, Booking.com, etc.)
  - name: accounting_reconciliation
    summary: "Reconciliation records matching bank entries with platform payouts"
    columns:
      - name: created_at
        type: timestamp
        description: Record creation timestamp
      - name: updated_at
        type: timestamp
        description: Record last update timestamp
      - name: id
        type: text
        primary_key: true
        description: Unique identifier (primary key)
      - name: status
        type: text
        allowed_values:
          - matched
          - unmatched
        description: "Reconciliation status (matched: reconciled, unmatched: pending)"
      - name: bank_entry_id
        type: text
        references: accounting_bankentry.id
        description: Bank transaction entry being reconciled
      - name: payout_id
        type: text
        references: accounting_payout.id
        description: Platform payout being matched to bank entry
    description: Reconciliation records matching bank entries with platform payouts
  - name: accounting_transaction
    summary: "Financial transactions from platforms: payments, refunds, fees, adjustments"
    columns:
      - name: created_at
        type: timestamp
        description: Record creation timestamp
      - name: updated_at
        type: timestamp
        description: Record last update timestamp
      - name: id
        type: text
        primary_key: true
        description: Unique identifier (primary key)
      - name: date
        type: timestamp
        description: Transaction date
      - name: arrival_date
        type: timestamp
        description: Guest arrival date for the related reservation
      - name: type
        type: text
        allowed_values:
          - adjustment
          - advance_funding
          - Ajuste
          - Ajuste de Resolução
          - charge
          - Pagamento da Resolução
          - Passar Pelo Total
          - Passar por Ajuste Total
          - payment
          - payment_refund
          - payout
          - Reembolso da Taxa de Cancelamento
          - refund
          - refund_deduction
          - Reserva
          - Reservation
          - Reservation without TT
          - stripe_fee
          - Taxa de Cancelamento
        description: Transaction type (payment, refund, adjustment, payout, etc.)
      - name: confirmation_code
        type: text
        description: Booking confirmation code
      - name: reservation_date
        type: timestamp
        description: Date when reservation was made
      - name: start_date
        type: timestamp
        description: Reservation start date
      - name: end_date
        type: timestamp
        description: Reservation end date
      - name: nights
        type: integer
        description: Number of nights in the stay
      - name: guest
        type: text
        description: Guest name
      - name: listing
        type: text
        description: Listing name/identifier
      - name: details
        type: text
        description: Additional transaction details
      - name: service_fee
        type: decimal
        description: Platform service fee charged
      - name: fast_pay_fee
        type: decimal
        description: Fast payout fee if applicable
      - name: cleaning_fee
        type: decimal
        description: Cleaning fee amount
      - name: pet_fee
        type: decimal
        description: Pet fee if applicable
      - name: gross_earnings
        type: decimal
        description: Total earnings before fees
      - name: transaction_amount
        type: decimal
        description: Transaction amount
      - name: amount
        type: decimal
        description: Net amount received/paid
      - name: occupancy_taxes
        type: decimal
        description: Occupancy/tourist tax amount
      - name: earnings_year
        type: integer
        description: Year for tax reporting purposes
      - name: platform
        type: text
        description: Platform where transaction occurred
      - name: charge_id
        type: text
        description: Platform charge identifier
      - name: payout_id
        type: text
        references: accounting_payout.id
        description: Related payout record
      - name: issue
        type: text
        allowed_values:
          - bad_classification
          - fix_creditnote
          - fix_unknown
          - no_invoice
          - no_reservation
          - none
          - not_supported
        description: Data quality issue flag (none, no_invoice, bad_classification, etc.)
      - name: items
        type: text
        description: JSON array of transaction line items
    description: Financial transactions from booking platforms including payments, refunds, and adjustments
  - name: airbnb_avg_ratings
    summary: "Aggregated Airbnb review ratings by category and month"
    columns:
      - name: platform
        type: text
        allowed_values:
          - airbnb
        description: Platform name (airbnb)
      - name: rating_type
        type: text
        allowed_values:
          - accuracy
          - checkin
          - cleanliness
          - communication
          - location
          - overall
          - value
        description: Rating category (overall, accuracy, checkin, cleanliness, communication, location, value)
      - name: review_month
        type: text
        allowed_values:
          - 2024-06
          - 2024-08
          - 2024-09
          - 2024-10
          - 2024-11
          - 2024-12
          - 2025-01
          - 2025-02
          - 2025-03
          - 2025-04
          - 2025-05
          - 2025-06
          - 2025-07
        description: Month of reviews being aggregated (YYYY-MM format)
      - name: avg_rating
        type: decimal
        description: Average rating for this category and month
      - name: total_ratings
        type: integer
        description: Number of ratings included in average
      - name: min_rating
        type: decimal
        description: Minimum rating received
      - name: max_rating
        type: decimal
        description: Maximum rating received
      - name: rating_std_dev
        type: decimal
        description: Standard deviation of ratings
      - name: percentage_5_star
        type: decimal
        description: Percentage of perfect 5-star ratings
      - name: count_5_star
        type: integer
        description: Count of perfect 5-star ratings
      - name: latest_review_date
        type: timestamp
        description: Date of most recent review
      - name: earliest_review_date
        type: timestamp
        description: Date of earliest review in aggregation
      - name: rating_scale
        type: text
        allowed_values:
          - 0-10
          - 0-5
        description: Rating scale used (0-5 for Airbnb)
    description: Aggregated average ratings from Airbnb reviews by rating type and month
  - name: booking_avg_ratings
    summary: "Aggregated Booking.com review ratings by category and month"
    columns:
      - name: platform
        type: text
        allowed_values:
          - booking
        description: Platform name (booking)
      - name: rating_type
        type: text
        allowed_values:
          - cleanliness
          - location
          - overall
          - value_for_money
        description: Rating category (overall, cleanliness, location, value_for_money)
      - name: review_month
        type: text
        allowed_values:
          - 2024-12
          - 2025-01
          - 2025-02
          - 2025-03
          - 2025-04
          - 2025-05
          - 2025-06
          - 2025-07
        description: Month of reviews being aggregated (YYYY-MM format)
      - name: avg_rating
        type: decimal
        description: Average rating for this category and month
      - name: total_ratings
        type: integer
        description: Number of ratings included in average
      - name: min_rating
        type: decimal
        description: Minimum rating received
      - name: max_rating
        type: decimal
        description: Maximum rating received
      - name: rating_std_dev
        type: decimal
        description: Standard deviation of ratings
      - name: percentage_perfect_star
        type: decimal
        description: Percentage of perfect 10/10 ratings
      - name: count_perfect_star
        type: integer
        description: Count of perfect 10/10 ratings
      - name: latest_review_date
        type: timestamp
        description: Date of most recent review
      - name: earliest_review_date
        type: timestamp
        description: Date of earliest review in aggregation
      - name: rating_scale
        type: text
        allowed_values:
          - 0-10
          - 0-5
        description: Rating scale used (0-10 for Booking.com)
    description: Aggregated average ratings from Booking.com reviews by rating type and month
  - name: listings_listing
    summary: "Property listings with pricing, location, amenities, and availability settings"
    columns:
      - name: created_at
        type: timestamp
        description: Record creation timestamp
      - name: updated_at
        type: timestamp
        description: Record last update timestamp
      - name: id
        type: text
        primary_key: true
        description: Unique identifier (primary key)
      - name: pms_listing_id
        type: text
        description: Listing ID in Property Management System
      - name: cleaning_fee
        type: decimal
        description: Standard cleaning fee charged per stay
      - name: validation_errors
        type: text
        description: JSON array of validation errors if any
      - name: validation_status
        type: text
        allowed_values:
          - incomplete
        description: Data validation status
      - name: additional_fees
        type: text
        description: JSON array of additional fees
      - name: cancellation_fee
        type: decimal
        description: Fee charged for cancellations
      - name: description
        type: text
        description: Property description shown to guests
      - name: extra_guest_fee
        type: decimal
        description: Additional fee per guest beyond base occupancy
      - name: listing_type
