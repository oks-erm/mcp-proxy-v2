    description: Property listings published on booking platforms (main rental units)
  - name: listings_listingchannel
    summary: "Distribution channels where listings are published (Airbnb, Booking)"
    columns:
      - name: created_at
        type: timestamp
        description: Record creation timestamp
      - name: updated_at
        type: timestamp
        description: Record last update timestamp
      - name: id
        type: text
        primary_key: true
        description: Unique identifier (primary key)
      - name: channel
        type: text
        description: Distribution channel name (airbnb, booking, etc.)
      - name: channel_listing_id
        type: text
        description: Listing identifier in the channel system
      - name: status
        type: text
        description: Channel listing status
      - name: url
        type: text
        description: Direct URL to the listing on the channel
      - name: listing_id
        type: text
        references: listings_listing.id
        description: Internal listing reference
    description: Distribution channels where listings are published (Airbnb, Booking.com, etc.)
  - name: listings_listingunit
    summary: "Association between listings and physical units for multi-unit properties"
    columns:
      - name: id
        type: integer
        primary_key: true
        description: Unique identifier (primary key)
      - name: created_at
        type: timestamp
        description: Record creation timestamp
      - name: updated_at
        type: timestamp
        description: Record last update timestamp
      - name: allocation_pct
        type: decimal
        description: Percentage of unit allocated to this listing (for shared units)
      - name: listing_id
        type: text
        references: listings_listing.id
        description: Listing identifier
      - name: unit_id
        type: text
        references: listings_unit.id
        description: Physical unit identifier
    description: Association between listings and physical units (for multi-unit properties)
  - name: listings_regiongroup
    summary: "Geographic regions for organizing units and staff assignments"
    columns:
      - name: created_at
        type: timestamp
        description: Record creation timestamp
      - name: updated_at
        type: timestamp
        description: Record last update timestamp
      - name: id
        type: text
        primary_key: true
        description: Unique identifier (primary key)
      - name: external_region_group_id
        type: text
        description: Region group ID in external system
      - name: external_region_group_name
        type: text
        description: Region group name
      - name: unit_id
        type: text
        references: listings_unit.id
        description: Unit assigned to this region
    description: Geographic regions/groups for organizing units and operations
  - name: listings_serviceconnection
    summary: "External service integrations connected to listings or units"
    columns:
      - name: created_at
        type: timestamp
        description: Record creation timestamp
      - name: updated_at
        type: timestamp
        description: Record last update timestamp
      - name: id
        type: text
        primary_key: true
        description: Unique identifier (primary key)
      - name: external_service_id
        type: text
        description: Service identifier in external system
      - name: listing_id
        type: text
        references: listings_listing.id
        description: Connected listing
      - name: unit_id
        type: text
        references: listings_unit.id
