        description: Listing lifecycle status (LIVE, ONBOARDING, OFFBOARDING, CHURNED)
      - name: title
        type: text
        description: Listing title/name shown to guests
      - name: weekly_discount
        type: decimal
        description: Discount percentage for weekly stays
      - name: accommodates
        type: integer
        description: Maximum number of guests
      - name: address
        type: text
        description: Property street address
      - name: amenities
        type: text
        description: JSON array of amenities (WiFi, AC, Kitchen, etc.)
      - name: base_price
        type: decimal
        description: Base nightly rate
      - name: bathrooms
        type: decimal
        description: Number of bathrooms
      - name: bedrooms
        type: integer
        description: Number of bedrooms
      - name: beds
        type: integer
        description: Number of beds
      - name: city
        type: text
        description: City where property is located
      - name: country
        type: text
        allowed_values:
          - Portugal
        description: Country (Portugal)
      - name: currency
        type: text
        allowed_values:
          - EUR
        description: Pricing currency (EUR)
      - name: default_checkin_time
        type: timestamp
        description: Standard check-in time
      - name: default_checkout_time
        type: timestamp
        description: Standard check-out time
      - name: latitude
        type: decimal
        description: Property latitude coordinate
      - name: longitude
        type: decimal
        description: Property longitude coordinate
      - name: markups
        type: text
        description: JSON array of pricing markups
      - name: max_nights
        type: integer
        description: Maximum stay length in nights
      - name: min_nights
        type: integer
        description: Minimum stay length in nights
      - name: nickname
        type: text
        description: Internal nickname for easy reference this is usually the name of the property
      - name: picture_url
        type: text
        description: Main property photo URL
      - name: property_type
        type: text
        allowed_values:
          - Apartment
          - Guesthouse
          - House
          - Serviced apartment
          - Studio
          - Villa
        description: Property type (Apartment, House, Villa, Studio, etc.)
      - name: room_type
        type: text
        description: Room type (Entire place, Private room, Shared room)
      - name: tags
        type: text
        description: JSON array of tags for categorization
      - name: taxes
        type: text
        description: JSON array of applicable taxes
      - name: timezone
        type: text
        description: Property timezone
      - name: is_active
        type: boolean
        description: Whether listing is currently active
      - name: is_listed
        type: boolean
        description: Whether listing is published on platforms
      - name: location_score
        type: decimal
        description: Location quality score (0-100)
      - name: quality_score
        type: decimal
        description: Overall property quality score (0-100)
      - name: typology
        type: text
        allowed_values:
          - Hostel
          - Multi
          - Room
          - T0
          - T1
          - T2
          - T3
          - T4
          - T5
          - T6
