[tool.poetry]
name = "mcp-proxy"
version = "0.1.0"
description = "MCP Proxy - single entry point for multiple MCP servers"
authors = ["Host-Wise"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115.0"
uvicorn = ">=0.27.0"
httpx = ">=0.27.0"
pydantic = ">=2.0.0"
google-cloud-firestore = ">=2.16.0"
google-cloud-logging = ">=3.14.0"
google-cloud-secret-manager = ">=2.20.0"
PyJWT = ">=2.8.0"
google-auth = ">=2.0.0"
python-multipart = ">=0.0.6"
PyYAML = ">=6.0.0"
cryptography = ">=42.0.0"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.3.0"
pytest = "^8.3.0"
respx = "^0.22.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
