# Rich routing hints merged into mcp_proxy://help/tool/{name} and by-task pages (optional fields per tool).
tool_help_rich:
  mcp_proxy_list_skills:
    summary: "List the shared Codex skills currently published by the MCP proxy."
    required_inputs:
      - "No required fields. Optional `include_files=true` adds the packaged file list for each skill."
    failure_modes:
      - "This proxy-local tool should not depend on upstream server permissions."
    if_empty: "No published skills are currently available from this proxy catalog."
    next_steps:
      - "Call `mcp_proxy_install_skill` with a `skill_name` from the returned catalog."
  mcp_proxy_install_skill:
    summary: "Prepare install metadata for one shared Codex skill, including the downloadable tar.gz bundle."
    required_inputs:
      - "`skill_name` (required) — exact catalog name returned by `mcp_proxy_list_skills`."
    failure_modes:
      - "**validation_error** if `skill_name` is omitted or unknown."
    if_empty: "Not applicable; on success the tool returns bundle metadata and install commands."
    next_steps:
      - "Download the returned `bundle_url`, unpack it, move the skill folder into `~/.codex/skills/<skill-name>`, then restart Codex."
      - "Ask before replacing an existing installed skill with the same name."
  mcp_proxy_request_skill_update:
    summary: "Submit a change request for a shared Codex skill when the published instructions should improve for everyone."
    required_inputs:
      - "`skill_name` (required) — exact published skill name."
      - "`summary` (required) — short statement of the missing rule, example, or behavior."
    failure_modes:
      - "**validation_error** if the skill does not exist or required fields are missing."
      - "**rate_limited** if too many requests are submitted in a short time."
    if_empty: "Not applicable; on success the tool returns a request id."
    next_steps:
      - "Use the request id for follow-up and include specific examples in `details` or `desired_outcome`."
  mcp_proxy_request_improvement:
    summary: "Submit a product improvement request when a proxied tool is broken, incomplete, or an upstream should expose more tools."
    required_inputs:
      - "`summary` (required) — short statement of the gap or failure."
      - "At least one of `tool_names` or `server_ids` (required) — identify what should improve."
    failure_modes:
      - "**validation_error** if you omit both `tool_names` and `server_ids`, or reference an unknown tool/server."
      - "**rate_limited** if you submit requests too quickly or already have too many pending requests."
    if_empty: "Not applicable; on success the tool returns a request id. If it fails validation, correct the target tool/server names and retry."
    next_steps:
      - "Use the returned request id for tracking in the MCP Proxy Approvals UI."
      - "When the request came from an error, include `error_context.failed_tool_name`, `error_context.error_message`, and `error_context.error_code` when available."
  guesty_find_listing:
    required_inputs:
      - "`query` (string, required) — listing title, nickname, or address fragment; not a Guesty `_id`."
    failure_modes:
      - "**validation_error** if `query` is empty or whitespace."
      - "**guesty_api_error** — transport or Guesty outage; `retryable` in tool envelope."
    if_empty: "Try shorter or alternate spellings; confirm the listing is active in Guesty. If the user gave a code or id, use `guesty_search_listings` / `guesty_get_listings` with filters instead of this resolver."
    next_steps:
      - "Use returned `_id` with `guesty_get_listing_summary` or pass listing context into `guesty_find_reservation`."
  guesty_find_reservation:
    required_inputs:
      - "At least one of: `confirmation_code`, `guest_name`, `listing_query`, `check_in`, `check_out`."
    failure_modes:
      - "**validation_error** when no identifier is provided or dates are not `YYYY-MM-DD`."
      - "**guesty_api_error** on upstream failure."
    if_empty: "Widen dates, drop optional filters, or resolve listing first with `guesty_find_listing` and pass `listing_query`. For structured filters use `guesty_search_reservations`."
    next_steps:
      - "With `listingId` from a row, call `guesty_get_listing_summary` for property context."
  guesty_get_listing_summary:
    required_inputs:
      - "`listing_id` (string) — Guesty listing `_id`."
    failure_modes:
      - "**validation_error** if `listing_id` missing."
      - "**guesty_api_error** if listing not found or API fails."
    if_empty: "N/A for success path; not-found is an error. Re-check id from `guesty_find_listing` or reservation payload."
    next_steps:
      - "Use raw `guesty_get_listings` / listing APIs only if summary fields are insufficient."
  guesty_search_reservations:
    required_inputs:
      - "`filters` (list of `{field, operator, value}`) when narrowing; optional pagination `limit` / `skip`."
    failure_modes:
      - "**guesty_api_error** on bad filter shape or upstream errors."
    if_empty: "`results: []` is valid — tighten or loosen filters, check listing id, or use `guesty_find_reservation` for human clues."
    next_steps:
      - "Prefer `guesty_find_reservation` when the user gave a name, code, or informal listing hint."
  zendesk_find_ticket_by_reservation_id:
    required_inputs:
      - "`reservation_id` (string) — PMS / Guesty reservation identifier."
    failure_modes:
      - "**validation_error** if `reservation_id` empty."
      - "**upstream_failed** on Zendesk or custom-object errors."
    if_empty: 'No linked ticket candidates — try `zendesk_search_tickets` with `type:ticket "<id>"` or ask for confirmation code / guest email.'
    next_steps:
      - "Call `zendesk_get_ticket` on a candidate id; use `zendesk_get_ticket_audits` for history."
  zendesk_search_tickets:
    required_inputs:
      - "`query_string` — Zendesk search syntax (e.g. `type:ticket status:new`)."
    failure_modes:
      - "**upstream_failed** on API errors."
    if_empty: "Broaden query, remove restrictive clauses, or use `zendesk_find_ticket_by_reservation_id` if you have a reservation id."
    next_steps:
      - "Use `zendesk_get_ticket` once you have a numeric ticket id."
  zendesk_get_ticket:
    required_inputs:
      - "`ticket_id` (positive integer)."
    failure_modes:
      - "**validation_error** for non-numeric or non-positive id."
      - "**not_found** if ticket does not exist."
    if_empty: "N/A; use search/find first to obtain `ticket_id`."
    next_steps:
      - "`zendesk_get_ticket_audits` for timeline; custom objects if reservation linking needed."
  n8n_find_workflow_by_name:
    summary: "Resolve workflow id from a title fragment before get, update, or execution inspection."
    required_inputs:
      - "`query` (string) — workflow name fragment; parameter is not `name`."
    failure_modes:
      - "**validation_error** if `query` empty."
      - "HTTP errors from n8n API."
    if_empty: "Increase `limit_pages`, try substring, or list with `n8n_get_workflows` and filter locally."
    next_steps:
      - "`n8n_get_workflow` then `n8n_get_executions` with `workflow_id`; for authoring, clone node patterns from the fetched JSON."
  n8n_get_workflows:
    required_inputs:
      - "Optional `limit`, `cursor` per tool schema."
    failure_modes:
      - "HTTP errors from n8n API."
    if_empty: "Legitimate last page or empty instance — widen search; if user named a workflow prefer `n8n_find_workflow_by_name`."
    next_steps:
      - "`n8n_get_workflow` for a chosen id; `n8n_find_workflow_by_name` when you have a title hint."
  n8n_get_workflow:
    summary: "Load the canonical workflow document (nodes, connections, settings). Use before patching with `n8n_update_workflow`."
    authoring_style:
      - "Always **GET before patch** — preserves unrelated nodes and avoids accidental full-graph rewrites."
      - "When changing behavior, edit **only** what is needed; do not rename, move, or refactor unrelated nodes."
    required_inputs:
      - "`workflow_id` (string) from list or find tool."
    failure_modes:
      - "**validation_error** if id missing."
      - "HTTP errors (404 if deleted)."
    if_empty: "N/A on success path."
    next_steps:
      - "`n8n_get_executions` with `workflow_id`; `n8n_validate_workflow_definition` after local edits; node debugging via `n8n_list_node_files` / `n8n_get_node_source`."
  n8n_get_executions:
    required_inputs:
      - "Optional `workflow_id`, `status`, `cursor` for pagination."
    failure_modes:
      - "HTTP errors from n8n."
    if_empty: "No runs yet or filters too strict — widen status, clear `workflow_id` to scan (careful with volume), check workflow is active and triggers fire."
    next_steps:
      - "`n8n_get_workflow` to compare definition; `n8n_retry_execution` / `n8n_stop_execution` per product rules."
  n8n_list_nodes:
    summary: "Step 1 of node discovery: list package folder names from the n8n nodes repo on GitHub."
    authoring_style:
      - "Pick **only** the integrations you need — fewer node types usually means a smaller, clearer workflow."
      - "Prefer a **single native node** (with expressions) over chaining extra transformers or a Code node."
    required_inputs:
      - "Optional `structured` (default true) — shape of returned list."
    failure_modes:
      - "GitHub HTTP errors (rate limit, network)."
    if_empty: "Rare for healthy GitHub fetch — retry; verify `GITHUB_TOKEN` if rate-limited."
    next_steps:
      - "`n8n_list_node_files(node_name=...)` then `n8n_get_node_source(file_path=...)`; or `n8n_find_node_by_name_or_capability` to shortlist folders."
  n8n_list_node_files:
    summary: "Step 2: list `.ts` and other files for one node package; pick e.g. `*.node.ts` for properties."
    authoring_style:
      - "Open **one** node implementation and copy **minimal** `parameters` — avoid cargo-culting every optional field."
    required_inputs:
      - "`node_name` (string) — folder name from `n8n_list_nodes` or finder tool."
    failure_modes:
      - "GitHub HTTP errors; empty `items` if `node_name` missing (validation success, not an error)."
    if_empty: "Pass non-empty `node_name`; if folder wrong use `n8n_find_node_by_name_or_capability` or `n8n_search_nodes`."
    next_steps:
      - "`n8n_get_node_source` with repo-relative `file_path` from an item’s path."
  n8n_get_node_source:
    summary: "Step 3: read source for `properties` / defaults — paste shapes into workflow node `parameters` carefully."
    authoring_style:
      - "Use the source to confirm **required** properties only; default the rest unless you need them — smaller graphs stay readable."
    required_inputs:
      - "`file_path` — e.g. `nodes/Slack/Slack.node.ts` from list_node_files."
    failure_modes:
      - "GitHub raw fetch errors."
    if_empty: "Pass `file_path`; empty text means missing path — re-list files or search."
    next_steps:
      - "Build or patch nodes in `n8n_create_workflow` / `n8n_update_workflow`; then `n8n_validate_workflow_definition`."
  n8n_search_nodes:
    summary: "GitHub **code search** when keyword discovery across files is needed; prefer folder list + source when you already know the package."
    authoring_style:
      - 'Use search to find **one** right node type; avoid piling on multiple similar integrations "just in case".'
    required_inputs:
      - "`query` (non-empty string) — search fragment."
    failure_modes:
      - "**github_rate_limited** /401 / 403 — set `GITHUB_TOKEN` and retry."
      - "Generic HTTP errors."
    if_empty: "Broaden `query`; if search unavailable use `n8n_list_nodes` + `n8n_find_node_by_name_or_capability`."
    next_steps:
      - "`n8n_get_node_source` on a returned `path`; then author workflow."
  n8n_find_node_by_name_or_capability:
    summary: "Shortlist node package folders from a human query; reduces guesswork without reading the entire node list."
    authoring_style:
      - "Pick the **top-scoring** folder when it clearly matches; avoid exploring every GitHub hit — stay minimal."
    required_inputs:
      - '`query` (string) — human hint e.g. "slack message", "http request".'
    failure_modes:
      - "**validation_error** if `query` empty."
      - "GitHub errors when listing or searching."
    if_empty: "Try `n8n_search_nodes`; shorten query; browse `n8n_list_nodes` manually."
    next_steps:
      - "`n8n_list_node_files(node_name=<top_match>)` → `n8n_get_node_source`."
  n8n_validate_workflow_definition:
    authoring_style:
      - "Run before writes on non-trivial graphs; fixing duplicate names or bad wiring early keeps the workflow **lean** and valid."
    required_inputs:
      - "`nodes` (list) and `connections` (object) for full checks; optional `name`, `settings`."
    failure_modes:
      - "N/A — returns `valid` false with `errors` instead of throwing for structural issues."
    if_empty: "N/A."
    next_steps:
      - "Before moving on to workflow writes, load MCP prompt `mcp_proxy_n8n_workflow_assistant` and confirm the relevant `mcp_proxy://help/tool/...` pages."
      - "`n8n_create_workflow` or `n8n_update_workflow` after fixing errors; resource `n8n://templates/workflow-starter-minimal` for a skeleton."
  n8n_get_credentials:
    summary: "Non-secret listing — use to reuse existing credential **name** + **type** before `n8n_create_credential`."
    authoring_style:
      - "**Reuse** an existing `(name, type)` in node `credentials` maps whenever possible — fewer credentials means less noise and fewer secrets to manage."
      - "Call with **`fetch_all=true`** when deduplicating before bulk authoring (trade latency for certainty)."
    required_inputs:
      - "Optional pagination/limit per schema."
    failure_modes:
      - "HTTP errors from n8n."
    if_empty: "No credentials in instance — you must `n8n_get_credential_schema` + `n8n_create_credential` or pass `credentials` on workflow create."
    next_steps:
      - "`n8n_get_credential_schema` for the `type` you need; `n8n_create_credential` if no row matches."
  n8n_get_credential_schema:
    summary: "Required before creating a credential — defines `data` fields and credential `type` string."
    authoring_style:
      - "Fetch schema **only** when you must **create**; if `n8n_get_credentials` already has a usable row, skip creation entirely."
      - "Wrong `type` strings bloat debugging — confirm `type` from schema or an existing credential row, not from memory."
    required_inputs:
      - "`credential_type` (string) — n8n type id (from docs, existing credential, or node source)."
    failure_modes:
      - "**validation_error** if type missing."
      - "HTTP404 if type unknown."
    if_empty: "N/A — wrong type yields error; confirm type from node source or existing `n8n_get_credentials` rows."
    next_steps:
      - "`n8n_create_credential` with `name`, `type`, `data` matching schema; then reference in node `credentials` or workflow `credentials` arg."
  n8n_create_credential:
    summary: "Write: creates stored credential. Never log secrets; pass `data` only via tool args."
    authoring_style:
      - "Create **only** when no existing credential can be reused — every new credential is operational overhead."
      - "Prefer workflow `credentials` specs on create/update so the server can **reuse by name+type** automatically."
    required_inputs:
      - "`name`, `type`, `data` per tool schema — `data` keys must match `n8n_get_credential_schema`."
    failure_modes:
      - "**validation_error** on bad shape."
      - "HTTP 400 on invalid type or data."
    if_empty: "N/A."
    next_steps:
      - "`n8n_get_credentials` to confirm; attach to nodes via workflow `credentials` list on create/update or node `credentials` map."
  n8n_create_workflow:
    summary: "Write: POST a new workflow. Tags include `mcp`; the proxy auto-injects `user_name` from the authenticated user so `created_by:<name>` is added automatically; `summary` is required and becomes a sticky note in the canvas."
    authoring_style:
      - "Agents should first load MCP prompt **`mcp_proxy_n8n_workflow_assistant`** and follow `mcp_proxy://help/n8n` plus `mcp_proxy://help/by-task/n8n-create-workflow` before calling this tool for real workflow authoring."
      - "Prefer **updating** an existing workflow if one already fits — **create** only when there is no suitable workflow to extend."
      - "Ship the **smallest correct graph**: fewest nodes, native nodes + expressions over Code, no extra Set/placeholder nodes beyond the required summary sticky note."
      - "**Reuse credentials** (`n8n_get_credentials` first); do not activate (`active=true`) unless the user explicitly wants it live."
      - "Do not block creation on a Notion ticket. Use one only as optional metadata when the user already provides it."
      - "Ask **at most 2 clarifying questions**; otherwise state brief assumptions."
      - "Cookbook JSON below is **illustrative** — in production, strip examples down to the minimum nodes and parameters you actually need."
    required_inputs:
      - "`name` (string)."
      - "`summary` (string) — short description that the server writes into a Sticky Note."
      - "`nodes` (non-null list) — each node needs `id`, `name`, `type`, `typeVersion`, `position` ([x,y]), `parameters` (object)."
      - "`connections` (object) — keys are **source node names**; see deep dive."
    failure_modes:
      - "**validation_error** if `name`, `summary`, `nodes`, or `connections` missing."
      - "HTTP 400 if n8n rejects extra read-only fields on nodes, bad types, or malformed connections."
      - "Credential normalization errors from `credentials` list."
    if_empty: "N/A on success."
    next_steps:
      - "Response includes `mcp_next_steps`; always `n8n_get_workflow` with returned `id`; then `n8n_get_executions` after trigger fires."
    deep_dive: |
      **Minimalism**: The **Authoring style** section on this page and on `mcp_proxy://help/n8n` is normative — prefer the smallest correct workflow, reuse credentials, avoid unnecessary Code/Set/Note nodes, and do not activate unless asked.

      **MCP-native prerequisite**: before relying on this tool for workflow authoring, read `mcp_proxy://help/n8n`, `mcp_proxy://help/by-task/n8n-create-workflow`, and fetch prompt `mcp_proxy_n8n_workflow_assistant` with `prompts/get`.

      **Minimal node** (conceptual): `{ "id": "1", "name": "Start", "type": "n8n-nodes-base.manualTrigger", "typeVersion": 1, "position": [0, 0], "parameters": {} }`

      **Minimal connections**: top-level keys match **source** node **`name`** (not `id`). Under `main`, each output is a list of lists of links:
      `{ "Start": { "main": [ [ { "node": "NextNodeName", "type": "main", "index": 0 } ] ] } }`

      **Credential injection**: optional `credentials` argument is a list of `{ name, type, data }`. The server creates or reuses credentials and patches matching nodes that reference that name/type. Prefer listing `n8n_get_credentials` first. Do not paste secrets into chat.

      **Activation**: `active=true` runs activate after create (separate API call). If activation fails, workflow may still exist — fetch by id and fix nodes/parameters.

      **Starter**: read MCP resource `n8n://templates/workflow-starter-minimal`.

      Full journey: `mcp_proxy://help/by-task/n8n-create-workflow`.
    cookbooks:
      - title: "Webhook → Set → Slack"
        body: |
          Replace credential placeholders with real `n8n_create_credential` output or use the workflow `credentials` arg. By default, Slack nodes should reuse the credential named `Slack n8n Bot` unless the user explicitly says otherwise or the target workflow already uses another approved Slack credential. Slack node needs valid OAuth2 or access token credential type per your n8n version.

          ```json
          {
            "name": "Cookbook Webhook Slack",
            "nodes": [
              {
                "id": "w1",
                "name": "Webhook",
                "type": "n8n-nodes-base.webhook",
                "typeVersion": 2,
                "position": [0, 0],
                "parameters": { "path": "mcp-cookbook-webhook", "httpMethod": "POST", "responseMode": "onReceived" }
              },
              {
                "id": "s1",
                "name": "Shape",
                "type": "n8n-nodes-base.set",
                "typeVersion": 3,
                "position": [220, 0],
                "parameters": { "assignments": { "assignments": [ { "id": "a1", "name": "text", "value": "={{ $json.body.message }}", "type": "string" } ] } }
              },
              {
                "id": "sl1",
                "name": "Slack",
                "type": "n8n-nodes-base.slack",
                "typeVersion": 2,
                "position": [440, 0],
                "parameters": { "resource": "message", "operation": "post", "channel": "#general", "text": "={{ $json.text }}" },
                "credentials": { "slackApi": { "id": "YOUR_CREDENTIAL_ID", "name": "Slack n8n Bot" } }
              }
            ],
            "connections": {
              "Webhook": { "main": [ [ { "node": "Shape", "type": "main", "index": 0 } ] ] },
              "Shape": { "main": [ [ { "node": "Slack", "type": "main", "index": 0 } ] ] }
            },
            "settings": { "executionOrder": "v1" }
          }
          ```
      - title: "Cron → HTTP Request → Email"
        body: |
          Uses schedule trigger, HTTP node, and SMTP send. Set `YOUR_CREDENTIAL_ID` for SMTP from `n8n_get_credentials` or create via schema.

          ```json
          {
            "name": "Cookbook Cron HTTP Email",
            "nodes": [
              {
                "id": "c1",
                "name": "Cron",
                "type": "n8n-nodes-base.scheduleTrigger",
                "typeVersion": 1,
                "position": [0, 0],
                "parameters": { "rule": { "interval": [ { "field": "hours", "hoursInterval": 6 } ] } }
              },
              {
                "id": "h1",
                "name": "HTTP",
                "type": "n8n-nodes-base.httpRequest",
                "typeVersion": 4,
                "position": [240, 0],
                "parameters": { "method": "GET", "url": "https://httpbin.org/get", "options": {} }
              },
              {
                "id": "e1",
                "name": "Email",
                "type": "n8n-nodes-base.emailSend",
                "typeVersion": 2,
                "position": [480, 0],
                "parameters": {
                  "fromEmail": "automation@example.com",
                  "toEmail": "ops@example.com",
                  "subject": "Cron check",
                  "emailFormat": "text",
                  "text": "={{ JSON.stringify($json) }}"
                },
                "credentials": { "smtp": { "id": "YOUR_CREDENTIAL_ID", "name": "SMTP" } }
              }
            ],
            "connections": {
              "Cron": { "main": [ [ { "node": "HTTP", "type": "main", "index": 0 } ] ] },
              "HTTP": { "main": [ [ { "node": "Email", "type": "main", "index": 0 } ] ] }
            },
            "settings": { "executionOrder": "v1" }
          }
          ```
      - title: "Manual → IF → HTTP (form / validation pattern)"
        body: |
          Pattern for “input → validate → branch”. Adjust IF conditions and HTTP CRM node to your vendor (`type` / `parameters` from `n8n_get_node_source`).

          ```json
          {
            "name": "Cookbook Validate CRM",
            "nodes": [
              {
                "id": "m1",
                "name": "Manual",
                "type": "n8n-nodes-base.manualTrigger",
                "typeVersion": 1,
                "position": [0, 0],
                "parameters": {}
              },
              {
                "id": "if1",
                "name": "Valid",
                "type": "n8n-nodes-base.if",
                "typeVersion": 2,
                "position": [220, 0],
                "parameters": { "conditions": { "options": { "caseSensitive": true, "leftValue": "", "typeValidation": "strict" }, "conditions": [ { "id": "c1", "leftValue": "={{ $json.email }}", "rightValue": "", "operator": { "type": "string", "operation": "notEmpty" } } ], "combinator": "and" } }
              },
              {
                "id": "http1",
                "name": "CRM",
                "type": "n8n-nodes-base.httpRequest",
                "typeVersion": 4,
                "position": [460, -80],
                "parameters": { "method": "POST", "url": "https://api.example.com/contacts", "sendBody": true, "specifyBody": "json", "jsonBody": "={{ JSON.stringify($json) }}" }
              }
            ],
            "connections": {
              "Manual": { "main": [ [ { "node": "Valid", "type": "main", "index": 0 } ] ] },
              "Valid": { "main": [ [ { "node": "CRM", "type": "main", "index": 0 } ], [] ] }
            },
            "settings": { "executionOrder": "v1" }
          }
          ```
      - title: "Error trigger → Slack alert"
        body: |
          Uses n8n error trigger; Slack credential placeholder as above.

          ```json
          {
            "name": "Cookbook Error Slack",
            "nodes": [
              {
                "id": "err1",
                "name": "Error Trigger",
                "type": "n8n-nodes-base.errorTrigger",
                "typeVersion": 1,
                "position": [0, 0],
                "parameters": {}
              },
              {
                "id": "sl1",
                "name": "Slack",
                "type": "n8n-nodes-base.slack",
                "typeVersion": 2,
                "position": [260, 0],
                "parameters": { "resource": "message", "operation": "post", "channel": "#alerts", "text": "={{ $json.execution.url + ' failed: ' + $json.execution.error.message }}" },
                "credentials": { "slackApi": { "id": "YOUR_CREDENTIAL_ID", "name": "Slack n8n Bot" } }
              }
            ],
            "connections": {
              "Error Trigger": { "main": [ [ { "node": "Slack", "type": "main", "index": 0 } ] ] }
            },
            "settings": { "executionOrder": "v1" }
          }
          ```
      - title: "Code → HTTP (AI / text processing pattern)"
        body: |
          Code node runs JS; output feeds HTTP POST. Tune `typeVersion` from `n8n_get_node_source` for your n8n release.

          ```json
          {
            "name": "Cookbook Code HTTP",
            "nodes": [
              {
                "id": "m1",
                "name": "Manual",
                "type": "n8n-nodes-base.manualTrigger",
                "typeVersion": 1,
                "position": [0, 0],
                "parameters": {}
              },
              {
                "id": "code1",
                "name": "Process",
                "type": "n8n-nodes-base.code",
                "typeVersion": 2,
                "position": [220, 0],
                "parameters": { "jsCode": "return [{ json: { summary: ($input.first().json.inputText || '').slice(0, 500) } }];" }
              },
              {
                "id": "http1",
                "name": "Downstream",
                "type": "n8n-nodes-base.httpRequest",
                "typeVersion": 4,
                "position": [440, 0],
                "parameters": { "method": "POST", "url": "https://httpbin.org/post", "sendBody": true, "specifyBody": "json", "jsonBody": "={{ JSON.stringify($json) }}" }
              }
            ],
            "connections": {
              "Manual": { "main": [ [ { "node": "Process", "type": "main", "index": 0 } ] ] },
              "Process": { "main": [ [ { "node": "Downstream", "type": "main", "index": 0 } ] ] }
            },
            "settings": { "executionOrder": "v1" }
          }
          ```
  n8n_update_workflow:
    summary: "Write: GET existing workflow, merge your fields, PUT. Safe partial **node** edits merge by `id` unless `nodes_replace=true`."
    authoring_style:
      - "Agents should first load MCP prompt **`mcp_proxy_n8n_workflow_assistant`** and follow `mcp_proxy://help/n8n` before calling this tool for real workflow editing."
      - "Default path for existing workflows: **GET → minimal patch → update** — touch only nodes/fields that must change."
      - "Omit **`connections`** and **`settings`** unless you intentionally replace them entirely (full replace is easy to get wrong)."
      - "Do not toggle **`active`** unless the user asked; keep unrelated nodes and layout stable."
      - "Same anti-noise rules as create: **smallest correct graph**, **reuse credentials**, **native nodes over Code**, no gratuitous Set/Note nodes."
    required_inputs:
      - "`workflow_id` (string)."
    failure_modes:
      - "**validation_error** if `workflow_id` missing."
      - "HTTP 400 if n8n rejects stripped fields, bad connections, or invalid settings keys."
    if_empty: "N/A."
    next_steps:
      - "Use `mcp_next_steps` in response; re-fetch with `n8n_get_workflow`; inspect `n8n_get_executions`."
    deep_dive: |
      **Safe edit loop**: `n8n_get_workflow` → edit locally → `n8n_update_workflow` with only changed top-level keys.

      **Nodes**: Default **merge by `id`**: existing node is deep-copied, patch fields overlay; nested `parameters` objects are **shallow-merged**. New ids in the patch list are **appended**. With **`nodes_replace=true`**, the nodes array becomes **exactly** the list you pass (dangerous if incomplete).

      **Connections**: If you pass `connections`, the object **replaces the entire connections graph**. To keep edges, omit `connections` or send the full merged object from your GET.

      **Settings**: If you pass `settings`, it **replaces** workflow settings (server filters to allowed API keys). Omit to preserve.

      **active**: Handled **after** PUT via activate/deactivate endpoint when you change activation vs previous state.

      **Credentials**: Optional `credentials` list creates/reuses and patches nodes same as create.

      **Example partial node patch** (merge into existing node with id `abc123`): pass `nodes=[{"id": "abc123", "parameters": {"url": "https://example.com"}}]` with `nodes_replace=false`.
  n8n_stop_execution:
    required_inputs:
      - "`execution_id` (positive integer string)."
    failure_modes:
