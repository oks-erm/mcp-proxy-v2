# MCP proxy help catalog — extend when adding upstream servers or tools.
# domain key (map key) is used in URIs: mcp_proxy://help/{domain}

verb_glossary:
  find: "Resolve messy human input (names, codes, partial text) to candidate records or IDs. Prefer find_* when the user did not give a canonical ID."
  search: "Structured filtering over API-backed fields (dates, status, IDs). Prefer search_* when you need raw filtered rows or many matches."
  list: "Pagination / browsing when exploring without a strong filter. Prefer list_* for scanning pages of entities."
  get_summary: "Safe, curated detail when you already have an exact ID (or just resolved one). Prefer get_*_summary for agent-friendly views."
  get: "Full raw records from the upstream API. Use when summaries omit fields you need or for debugging."

examples:
  - want: "Listing id from a human name or nickname"
    tool: guesty_find_listing
    note: "Prefer over guesty_search_listings for name resolution."
  - want: "Reservation from human input (guest, code, listing hint)"
    tool: guesty_find_reservation
    note: "Then guesty_get_listing_summary with listing id if you need property context."
  - want: "Raw filtered reservation rows (dates, status, listing id)"
    tool: guesty_search_reservations
  - want: "Whether an employee is away on a specific date"
    tool: absence_is_user_absent_on_date
    note: "Prefer over listing all absences when you only need a yes/no for one date."
  - want: "Zendesk ticket tied to a reservation id"
    tool: zendesk_find_ticket_by_reservation_id
  - want: "Cross-platform guest complaint triage across Zendesk, Guesty, and Breezeway"
    tools:
      [zendesk_search_tickets, guesty_find_reservation, breezeway_list_tasks]
    note: "Journey `mcp_proxy://help/by-task/ops-guest-complaint-triage`."
  - want: "Diagnose why a property is not getting bookings"
    tools:
      [guesty_find_listing, guesty_get_listing_calendar, sql_gateway_run_query]
    note: "Journey `mcp_proxy://help/by-task/vacancy-diagnosis`."
  - want: "SQL / warehouse tables and columns"
    tool: sql_gateway_lookup_table
    note: "Resource sql_gateway://schema/models (narrative) and sql_gateway://schema/yaml (machine-readable)."
  - want: "n8n workflow by name, then inspect runs"
    tools: [n8n_find_workflow_by_name, n8n_get_executions]
  - want: "Author or update an n8n workflow via MCP (canonical steps)"
    tools:
      - n8n_get_workflow
      - n8n_validate_workflow_definition
      - n8n_create_workflow
    note: "Journey `mcp_proxy://help/by-task/n8n-create-workflow` and `mcp_proxy://help/workflow/n8n/author-workflow`."
  - want: "Stripe payout and its balance transactions"
    tools: [stripe_get_payouts, stripe_get_payout_transactions]
  - want: "Moloni invoices or credit notes (e.g. match portal invoice via your_reference)"
    tool: moloni_list_invoices
    note: "Use your_reference when correlating with internal invoice id; then moloni_get_invoice / moloni_get_credit_note for full document lines."
  - want: "A proxied tool keeps failing or a server needs new capabilities"
    tool: mcp_proxy_request_improvement
    note: "Name the affected tool_names and/or server_ids; include the latest error in error_context when available."
  - want: "Browse the shared Codex skills published by the proxy"
    tool: mcp_proxy_list_skills
    note: "Use before installing so you can inspect names, descriptions, and bundle URLs."
  - want: "Install one shared Codex skill into a local Codex environment"
    tool: mcp_proxy_install_skill
    note: "Returns the tar.gz bundle URL plus safe local install commands for ~/.codex/skills/<skill-name>."
  - want: "Check whether locally installed shared Codex skills are up to date"
    tool: mcp_proxy_check_skill_updates
    note: "Pass each installed skill name plus local version and/or content_sha256 to compare against the latest catalog metadata."
  - want: "Ask for a change to a shared Codex skill"
    tool: mcp_proxy_request_skill_update
    note: "Use when the shared skill is missing rules, examples, or safety guidance."

journeys:
  - id: guest-complaint-reservation
    title: "Guest complains about a reservation"
    domains: [guesty, zendesk]
    steps:
      - "Resolve listing/reservation with guesty_find_listing / guesty_find_reservation."
      - "Use guesty_get_listing_summary for property context when you have listing id."
      - "Search or fetch Zendesk tickets with zendesk_search_tickets or zendesk_find_ticket_by_reservation_id."
  - id: employee-away-date
    title: "Check if employee is away on a date"
    domains: [absence]
    steps:
      - "Resolve person with absence_find_user_by_name if needed."
      - "Call absence_is_user_absent_on_date for the date in question."
      - "Use absence_list_absences or absence_get_user_absences only when you need the full absence window details."
  - id: ops-guest-complaint-triage
    title: "Cross-platform guest complaint triage"
    domains: [zendesk, guesty, breezeway]
    steps:
      - "Start with `zendesk_search_tickets` to find open guest-complaint tickets in the trailing 7 days."
      - "For each ticket, resolve or confirm the reservation id; when a reservation id is already known, prefer `zendesk_find_ticket_by_reservation_id`."
      - "Use `guesty_find_reservation` or a tight `guesty_search_reservations` call to fetch reservation context, then `guesty_get_listing_summary` for the property."
      - "Resolve the matching Breezeway property with `breezeway_find_property_by_name_or_external_id`."
      - "Use `breezeway_list_tasks` scoped to that property to find open or overdue tasks. Use `breezeway_triage_tasks` only when the user truly wants a portfolio-wide urgency queue."
      - "Return one row per complaint and flag any row where an open complaint and an overdue Breezeway task exist together."
  - id: vacancy-diagnosis
    title: "Diagnose why a property is not getting bookings"
    domains: [guesty, sql, breezeway]
    steps:
      - "Resolve the listing with `guesty_find_listing`."
      - "Confirm listing status and identifiers with `guesty_get_listing_summary`."
      - "Use `guesty_get_listing_calendar` for the next 60 days to measure open, blocked, and reserved days."
      - "Inspect recent reviews with `guesty_search_reviews`."
      - "Before SQL, inspect schema with `sql_gateway_get_schema` or `sql_gateway_lookup_table` to find the occupancy model and join key."
      - "Use `sql_gateway_run_query` for a tight historical occupancy query over the previous 60 days."
      - "Resolve the Breezeway property and inspect open tasks with `breezeway_find_property_by_name_or_external_id` plus `breezeway_list_tasks`."
      - "Rank the top 3 hypotheses by likelihood and give one action per hypothesis."
  - id: stripe-payout-ledger
    title: "Find a Stripe payout and its transactions"
    domains: [stripe]
    steps:
      - "stripe_get_payouts (filter/narrow by time) → pick payout id."
      - "stripe_get_payout_transactions for line items."
      - "Drill into stripe_get_balance_transaction or stripe_get_charge when needed."
  - id: n8n-workflow-debug
    title: "Locate an n8n workflow by name and inspect executions"
    domains: [n8n]
    steps:
      - "n8n_find_workflow_by_name → workflow id."
      - "n8n_get_workflow for structure; n8n_get_executions for recent runs."
      - "n8n_get_node_source / n8n_search_nodes for node internals when debugging."
  - id: n8n-create-workflow
    title: "Create or extend an n8n workflow via MCP"
    domains: [n8n]
    steps:
      - "Before using `n8n_*` workflow authoring tools, read `mcp_proxy://help/n8n`, `mcp_proxy://help/by-task/n8n-create-workflow`, and fetch MCP prompt `mcp_proxy_n8n_workflow_assistant` with `prompts/get`."
      - "Authoring style (anti-noise): prefer the **smallest correct graph**; **update** existing workflows over creating new ones; **reuse credentials**; **native nodes + expressions** over Code; avoid extra Set/placeholder nodes; every new workflow must include a short sticky-note summary via the tool's required `summary`; **do not activate** unless asked; **at most 2 clarifying questions**. Full list: `mcp_proxy://help/n8n` (section **Authoring style**)."
      - "Reuse or discover a template: n8n_find_workflow_by_name or n8n_get_workflows → n8n_get_workflow (copy node `type`, `typeVersion`, and parameter patterns you need)."
      - "Choose node types: n8n_list_nodes → n8n_list_node_files → n8n_get_node_source; use n8n_search_nodes or n8n_find_node_by_name_or_capability when you do not know the package folder."
      - "Credentials: n8n_get_credentials (avoid duplicates) → n8n_get_credential_schema(credential_type) before n8n_create_credential; or pass `credentials` on create/update to create/reuse by name+type and patch nodes."
      - "Slack default: when a workflow uses Slack nodes, reuse the Slack credential named **`Slack n8n Bot`** unless the user explicitly asked for a different Slack credential or the existing workflow already uses another approved Slack credential. If `Slack n8n Bot` is missing, ask before creating or switching to another Slack credential."
      - "Validate locally: n8n_validate_workflow_definition (optional); starter JSON: resource `n8n://templates/workflow-starter-minimal`."
      - "Create: n8n_create_workflow — or update: n8n_get_workflow → merge changes → n8n_update_workflow (nodes merge by id by default; nodes_replace replaces the whole array; connections and settings replace entirely when passed; active is separate)."
      - "Verify: n8n_get_workflow → n8n_get_executions; fix activation or connection errors using the returned workflow id."

# Exposed via MCP resources/templates/list (override defaults in help_catalog.py if omitted).
resource_templates:
  - uriTemplate: "mcp_proxy://help/tool/{tool_name}"
    name: help-tool
    description: "Substitute proxied tool name (e.g. guesty_find_listing, sql_gateway_lookup_table)."
    mimeType: text/markdown
  - uriTemplate: "mcp_proxy://help/by-task/{slug}"
    name: help-by-task
    description: "Task or journey id from catalog (hyphenated slug, e.g. find-reservation, sql-schema)."
    mimeType: text/markdown
  - uriTemplate: "mcp_proxy://help/workflow/{domain}/{goal}"
    name: help-workflow
    description: "domain = catalog key; goal = workflow goal slug (see capabilities.json)."
    mimeType: text/markdown
  - uriTemplate: "mcp_proxy://help/by-domain/{domain}"
    name: help-by-domain
    description: "Alias of the domain guide for a catalog domain key."
    mimeType: text/markdown
  - uriTemplate: "mcp_proxy://help/{domain}"
    name: help-domain-direct
    description: "Direct domain guide URI; domain must be a catalog key (not index or capabilities.json)."
    mimeType: text/markdown

domains:
  guesty:
    title: Guesty
    server_ids: [guesty]
    description: "Property management: listings, reservations, guests, reviews."
    start_here:
      listing_from_text: guesty_find_listing
      reservation_from_text: guesty_find_reservation
    common_mistakes:
      - "Using guesty_search_listings for fuzzy human names — use guesty_find_listing first."
      - "Jumping to guesty_get_reservations without filters — use find/search with limits."
    escalation: "find_* → get_*_summary / compact lists → guesty_get_* for full raw payloads."
    aliases:
      - prefer: guesty_find_listing
        over: guesty_search_listings
        when: "Resolving a listing from human-readable name or nickname."

  zendesk:
    title: Zendesk
    server_ids: [zendesk]
    description: "Support tickets, users, custom objects, reservation-linked records."
    start_here:
      ticket_from_reservation: zendesk_find_ticket_by_reservation_id
      search_tickets: zendesk_search_tickets
    aliases:
      - prefer: find_ticket_by_reservation_id
        over: zendesk_find_ticket_by_reservation_id
        when: "You want the shorter proxy shorthand for reservation-linked Zendesk ticket lookup."
    common_mistakes:
      - "Fetching zendesk_get_ticket without an id — search or find first."
    escalation: "zendesk_list_views → zendesk_get_view_ticket_counts → zendesk_list_view_tickets; ticket workflows: zendesk_search_tickets / find_* → zendesk_get_ticket → zendesk_get_ticket_audits for history."

  n8n:
    title: n8n
    server_ids: [n8n]
    description: "Automations: workflows, credentials, executions, and node discovery (GitHub-backed). Canonical workflow authoring guidance is available directly through MCP resources/prompts, so clients can use n8n tools correctly without relying on local skill installation. Supports authoring via create/update workflow, structural validation, and resolver-style node lookup."
    start_here:
      workflow_by_name: n8n_find_workflow_by_name
      create_workflow: n8n_create_workflow
      dry_run_validate: n8n_validate_workflow_definition
      list_workflows: n8n_get_workflows
    authoring_style:
      - "Before authoring or updating workflows through MCP, read **`mcp_proxy://help/n8n`**, **`mcp_proxy://help/by-task/n8n-create-workflow`**, and fetch prompt **`mcp_proxy_n8n_workflow_assistant`** with `prompts/get`."
      - "Aim for the **smallest correct workflow**: the fewest nodes and edges that satisfy the requirement — no speculative complexity."
      - "Prefer **updating** (`n8n_update_workflow`) an existing workflow over **creating** (`n8n_create_workflow`) a new one when a target workflow already exists."
      - "**Reuse credentials** — call `n8n_get_credentials` before `n8n_create_credential`; do not duplicate `(name, type)` without a clear reason."
      - "For **Slack** nodes, default to the credential named **`Slack n8n Bot`** unless the user explicitly requested another Slack credential or the existing workflow already uses a different approved Slack credential."
      - "Prefer **native n8n nodes** and **expressions** over **Code** nodes; use Code only when the same outcome cannot be done cleanly with standard nodes."
      - "Avoid extra **Set / Edit Fields**, placeholder, disabled, or debug-only nodes unless they clearly reduce complexity. One short sticky-note summary is required on new workflows."
      - "Do not pass **`active=true`** (create) or toggle activation (update) unless the user explicitly wants the workflow live."
      - "For **Schedule Trigger** nodes, never create minute-based schedules or any recurrence under **2 hours**; prefer `hoursInterval >= 2` or a less frequent schedule."
      - "Every workflow created or updated through MCP must keep the **`mcp`** tag; never remove it and never leave a workflow without it."
      - "Do not require a Notion ticket to create or update a workflow. If the user already has one, treat it as optional business metadata."
      - "Ask **at most 2 clarifying questions**; if minor details are missing, state the safest brief assumption and proceed."
      - "Do not add retries, global error workflows, logging, or fallback branches unless the user explicitly asks."
      - "MCP prompt **`n8n_minimal_workflow_editor`** encodes the same discipline; read the exact body via **`resources/read`** on `n8n://prompts/n8n-minimal-workflow-editor` (full) or `n8n://prompts/n8n-minimal-workflow-editor/static` (rules only)."
    common_mistakes:
      - "Scanning all workflows manually — use n8n_find_workflow_by_name when the user gave a title."
      - "Guessing node `type` strings — use n8n_list_nodes / n8n_get_node_source or n8n_find_node_by_name_or_capability."
      - "Creating credentials without schema — always n8n_get_credential_schema before n8n_create_credential; list n8n_get_credentials first to reuse."
      - "Wrong credential type string — must match n8n’s type id from schema or existing credentials."
      - "Duplicate or conflicting node `id` values — ids must be unique; connections reference node **names**, not ids."
      - 'Broken `connections` shape — top-level keys are source node **names**; targets use `{ "node": "<targetName>", "type": "main", "index": 0 }` in `main` arrays.'
      - "Accidentally wiping graph on update — omit `connections` and `settings` unless you intend full replacement; partial node edits merge by id unless `nodes_replace=true`."
      - "Expecting runs without activation — triggers need correct config and often `active=true` (separate from PUT body in update tool)."
    escalation: "Authoring: `mcp_proxy://help/by-task/n8n-create-workflow`. Debug: n8n_find_workflow_by_name → n8n_get_workflow → n8n_get_executions; nodes: n8n_list_nodes → n8n_list_node_files → n8n_get_node_source."
    aliases:
      - prefer: n8n_find_workflow_by_name
        over: n8n_get_workflows
        when: "User supplied a workflow name or clear substring."
      - prefer: n8n_list_nodes
        over: n8n_search_nodes
        when: "You need the canonical package folder list before opening files (predictable, no GitHub code-search limits)."
      - prefer: n8n_get_credentials
        over: n8n_create_credential
        when: "Checking for an existing credential name/type to reuse."
      - prefer: n8n_get_credential_schema
        over: n8n_create_credential
        when: "You do not yet know required `data` fields for a credential type."
      - prefer: n8n_validate_workflow_definition
        over: n8n_create_workflow
        when: "Dry-run structural checks before a write (no API mutation)."
      - prefer: n8n_find_node_by_name_or_capability
        over: n8n_list_nodes
        when: 'Resolving which node folder matches human text like "slack message" without scanning the full list manually.'
    naming_tags: "Use clear workflow names (team or domain prefix). MCP adds tag `mcp` on create and the proxy automatically injects `user_name` from the authenticated user so `created_by:<name>` and `last_update:<name>` stay visible in the n8n UI."

  sql:
    title: SQL / warehouse
    server_ids: [sql-gateway]
    description: "Read-only SQL against approved models; schema discovery."
    start_here:
      schema: sql_gateway_get_schema
      table_columns: sql_gateway_lookup_table
      run: sql_gateway_run_query
    common_mistakes:
      - "Guessing column names — use sql_gateway_lookup_table or resources sql_gateway://schema/yaml."
    escalation: "sql_gateway_lookup_table / schema resources → sql_gateway_run_query with tight LIMIT."

  stripe:
    title: Stripe
    server_ids: [stripe]
    description: "Charges, payouts, balance, payment intents, refunds."
    start_here:
      payouts: stripe_get_payouts
      payout_lines: stripe_get_payout_transactions
    common_mistakes:
      - "Pulling all charges without time bounds — narrow first."
    escalation: "stripe_get_payouts → stripe_get_payout_transactions → stripe_get_charge / stripe_get_balance_transaction."

  absence:
    title: Absence / HR
    server_ids: [absence]
    description: "Users and absence periods."
    start_here:
      user_lookup: absence_find_user_by_name
      date_check: absence_is_user_absent_on_date
    common_mistakes:
      - "Listing every absence record when only a date check is needed — use absence_is_user_absent_on_date."
    aliases:
      - prefer: absence_is_user_absent_on_date
        over: absence_list_absences
        when: "Single-date presence check."
    escalation: "absence_find_user_by_name → absence_is_user_absent_on_date → absence_get_user_absences for detail."

  pipedrive:
    title: Pipedrive
    server_ids: [pipedrive]
    description: "Deals, persons, leads, pipelines."
    start_here:
      deal_by_title: pipedrive_find_deal_by_title_or_exact_name
    escalation: "pipedrive_find_deal_by_title_or_exact_name → pipedrive_get_deal_summary → pipedrive_get_deal."

  moloni:
    title: Moloni
    server_ids: [moloni]
    description: "Customer invoices and credit notes in Moloni (read-only)."
    start_here:
      invoices: moloni_list_invoices
      credit_notes: moloni_list_credit_notes
    common_mistakes:
      - "Assuming limit can exceed 50 — Moloni caps qty at 50 per request (the MCP clamps limit)."
    escalation: "moloni_list_invoices / moloni_list_credit_notes (optional filters) → moloni_get_invoice / moloni_get_credit_note with document_id. Use your_reference to align with portal invoice identifiers."

  breezeway:
    title: Breezeway
    server_ids: [breezeway]
    description: "Properties, tasks, users, and reservations (operations)."
    start_here:
      property: breezeway_find_property_by_name_or_external_id
      tasks: breezeway_list_tasks
    escalation: "breezeway_find_property_by_name_or_external_id → breezeway_get_property_summary. For task work: breezeway_list_tasks → breezeway_get_task_comments → breezeway_move_task / breezeway_update_task."

  quickbooks:
    title: QuickBooks
    server_ids: [quickbooks]
    description: "Bank accounts and transactions."
    start_here:
      accounts: quickbooks_list_bank_accounts
    escalation: "quickbooks_list_bank_accounts → quickbooks_get_bank_account_by_name → bank transaction tools."

  firestore:
    title: Firestore
    server_ids: [firestore-gateway]
    description: "Document reads and guarded queries."
    start_here:
      collections: firestore_gateway_list_collections
      query: firestore_gateway_query_documents
    escalation: "firestore_gateway_list_collections → firestore_gateway_query_documents → firestore_gateway_get_document."

tasks:
  find-reservation:
    title: "Find a Guesty reservation from human input"
    domain: guesty
    primary_tool: guesty_find_reservation
    also: [guesty_search_reservations]
  find-listing:
    title: "Find a Guesty listing from human input"
    domain: guesty
    primary_tool: guesty_find_listing
    also: [guesty_search_listings]
  guest-calendar:
    title: "Check Guesty listing availability for dates"
    domain: guesty
    primary_tool: guesty_is_listing_available_on_dates
    also: [guesty_get_listing_calendar]
  guesty-guest-lookup:
    title: "Find Guesty guest records"
    domain: guesty
    primary_tool: guesty_search_guests
    also: [guesty_get_guest, guesty_get_guests]
  zendesk-reservation-ticket:
    title: "Get Zendesk ticket for a reservation"
    domain: zendesk
    primary_tool: zendesk_find_ticket_by_reservation_id
    also: [zendesk_search_tickets]
  zendesk-ticket-by-id:
    title: "Load Zendesk ticket when you have ticket id"
    domain: zendesk
    primary_tool: zendesk_get_ticket
    also: [zendesk_search_tickets]
  sql-schema:
    title: "Discover SQL warehouse schema"
    domain: sql
    primary_tool: sql_gateway_get_schema
    also: [sql_gateway_get_schema_yaml, sql_gateway_lookup_table]
  sql-table-columns:
    title: "Column list for one warehouse table"
    domain: sql
    primary_tool: sql_gateway_lookup_table
    also: [sql_gateway_get_schema_yaml]
  sql-run:
    title: "Run read-only SQL"
    domain: sql
    primary_tool: sql_gateway_run_query
    also: [sql_gateway_lookup_table]
  n8n-workflow-locate:
    title: "Find n8n workflow by name"
    domain: n8n
    primary_tool: n8n_find_workflow_by_name
    also: [n8n_get_workflows]
  n8n-executions:
    title: "Inspect n8n workflow executions"
    domain: n8n
    primary_tool: n8n_get_executions
    also: [n8n_get_workflow]
  stripe-payout-recon:
    title: "Stripe payout and line items"
    domain: stripe
    primary_tool: stripe_get_payouts
    also: [stripe_get_payout_transactions]
  stripe-charge-lookup:
    title: "Stripe charge / payment detail"
    domain: stripe
    primary_tool: stripe_get_charges
    also: [stripe_get_charge, stripe_get_payment_intent]
  pipedrive-deal-resolve:
    title: "Resolve Pipedrive deal from title"
    domain: pipedrive
    primary_tool: pipedrive_find_deal_by_title_or_exact_name
    also: [pipedrive_search_deals]
  breezeway-property-resolve:
    title: "Resolve Breezeway property from name or external id"
    domain: breezeway
    primary_tool: breezeway_find_property_by_name_or_external_id
    also: [breezeway_list_properties_page]
  quickbooks-bank:
    title: "QuickBooks bank account and transactions"
    domain: quickbooks
    primary_tool: quickbooks_list_bank_accounts
    also:
      [quickbooks_get_bank_account_by_name, quickbooks_get_bank_transactions_in]
  firestore-query-doc:
    title: "Query Firestore collection"
    domain: firestore
    primary_tool: firestore_gateway_query_documents
    also: [firestore_gateway_list_collections]
  firestore-get-doc:
    title: "Read one Firestore document"
    domain: firestore
    primary_tool: firestore_gateway_get_document
    also: [firestore_gateway_query_documents]

workflows:
  - domain: guesty
    goal: find-reservation
    steps:
      - tool: guesty_find_listing
        when: "User gave property name only."
      - tool: guesty_find_reservation
        when: "Resolve reservation from guest, code, or listing context."
      - tool: guesty_get_listing_summary
        when: "Need curated listing detail after resolving listing id."
  - domain: guesty
    goal: guest-and-stay-context
    steps:
      - tool: guesty_find_reservation
      - tool: guesty_get_guest
      - tool: guesty_get_listing_summary
  - domain: zendesk
    goal: ticket-from-reservation
    steps:
      - tool: zendesk_find_ticket_by_reservation_id
      - tool: zendesk_get_ticket
      - tool: zendesk_get_ticket_audits
  - domain: zendesk
    goal: view-queue-analytics
    steps:
      - tool: zendesk_list_views
      - tool: zendesk_get_view_ticket_counts
      - tool: zendesk_list_view_tickets
