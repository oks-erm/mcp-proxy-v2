  breezeway_find_property_by_name_or_external_id:
    required_inputs:
      - "Human property name or external id string per tool."
    failure_modes:
      - "Upstream Breezeway errors."
    if_empty: "Try `breezeway_list_properties_page` with filters; verify external id format."
    next_steps:
      - "`breezeway_get_property_summary` after resolving property."
  breezeway_list_tasks:
    required_inputs:
      - "`home_id` or `reference_property_id` so the task list is scoped to a property/home."
    failure_modes:
      - "Validation errors for missing scope or invalid sort order."
      - "Upstream Breezeway task-list errors."
      - "When `include_comments=true`, individual task rows may carry `comments_error` if one thread lookup fails."
    if_empty: "Check the property/home identifier and date filters; task lists are often empty outside the turnover window."
    next_steps:
      - "`breezeway_triage_tasks` when the user wants the urgent queue across multiple properties."
      - "`breezeway_get_task_comments` for one task thread."
      - "`breezeway_move_task` or `breezeway_update_task` when the user explicitly wants to change task state/details."
  breezeway_triage_tasks:
    required_inputs:
      - "No property id required; optional scan caps (`max_properties`, `max_tasks_per_property`) and shortlist size (`limit`)."
    failure_modes:
      - "Upstream Breezeway property or task-list errors during the portfolio scan."
      - "Partial scan results may include `scan_summary.properties_with_errors` when some properties fail."
      - "When `include_comments=true`, only returned shortlist tasks are hydrated with comment previews."
    if_empty: "If the portfolio scan is empty, verify Breezeway has open tasks or lower the urgency threshold by drilling into a specific property with `breezeway_list_tasks`."
    next_steps:
      - "`breezeway_get_task_comments` for one shortlisted task thread."
      - "`breezeway_move_task` or `breezeway_update_task` after the user confirms what to do with a shortlisted task."
  breezeway_get_task_comments:
    required_inputs:
      - "`task_id` (integer) for one known Breezeway task."
    failure_modes:
      - "Validation error for bad task ids."
      - "Upstream 404 / permission / availability errors from Breezeway."
    if_empty: "If you only need comments alongside a task page, use `breezeway_list_tasks(include_comments=true)` instead."
    next_steps:
      - "Summarize the thread or follow with `breezeway_move_task` / `breezeway_update_task` if the user asks to act on it."
  breezeway_move_task:
    required_inputs:
      - "`task_id` and `action` where action is exactly one of `close`, `approve`, or `reopen`."
    failure_modes:
      - "Validation error for bad action names or task ids."
      - "Upstream rejection when the transition is not allowed for the current task state."
      - "Permission errors in mcp-proxy when the user lacks write access on server `breezeway`."
    if_empty: "If the user wanted to edit task fields rather than change state, use `breezeway_update_task`."
    next_steps:
      - "Optionally re-read tasks with `breezeway_list_tasks` if you need the refreshed task list."
  breezeway_update_task:
    required_inputs:
      - "`task_id` and a non-empty `updates` object that matches Breezeway's PATCH task schema."
      - "Common documented update keys: `name`, `type_department`, `type_priority`, `description`, `template_id`, `scheduled_date`, `scheduled_time`, `assignments`, `tags`, `subdepartment_id`, `rate_paid`, `rate_type`, `requested_by`."
    failure_modes:
      - "Validation error for empty or non-object update payloads."
      - "Upstream rejection when PATCH fields are unsupported or invalid."
      - "Permission errors in mcp-proxy when the user lacks write access on server `breezeway`."
    if_empty: "If the desired change is only a workflow transition, prefer `breezeway_move_task`."
    next_steps:
      - "Re-read the task list or task thread if the user wants to confirm the updated state."
