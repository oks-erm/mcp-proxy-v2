[project]
name = "breezeway-mcp"
version = "0.1.0"
description = "MCP server for Breezeway inventory, users, tasks, and reservations."
authors = [
  { name = "pdrivomHW", email = "pedro.marques@hostwise.pt" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard] (>=0.115.0,<0.120.0)",
  "mcp[cli] (>=1.26.0,<2.0.0)",
  "requests (>=2.31.0,<3.0.0)",
  "uvicorn (>=0.27.0,<1.0.0)",
  "google-cloud-secret-manager (>=2.20.0,<3.0.0)",
  "google-cloud-firestore (>=2.20.0,<3.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
